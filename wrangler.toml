name = "awakemu-telegram-bot"
main = "worker.js"
compatibility_date = "2023-10-18"

# Cron trigger: execute every minute
[triggers]
crons = ["* * * * *"]

# KV Namespace binding. 
# REPLACE the id with the one generated by `npx wrangler kv:namespace create AWAKE_CACHE`
[[kv_namespaces]]
binding = "AWAKE_CACHE"
id = "81926ce29666486dae23c55c02234b32"

[[routes]]
pattern = "avisosmu.ezequielfredes.com.ar"
custom_domain = true

# Ensure you set these secrets using `npx wrangler secret put <NAME>`:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID

[vars]
# You can define which events you want to be notified for here, comma separated.
# If empty or not set, it will notify for ALL events.
TARGET_EVENTS = "Blood Castle,Devil Square,Chaos Castle,Kanturu,Illusion Temple"
# Number of minutes before the event to send the notification
MINUTES_BEFORE = "10"
